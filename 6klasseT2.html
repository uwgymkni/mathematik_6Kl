<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Teil 2 · 6. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>

/* Layout: Schiene links mit fünf Routen, rechts genau eine Ansicht (Übersicht, Etappe oder Training).
   Leitbild ist das Höhenprofil: jede Route steigt in drei Etappen, die Steigung ist die Schwierigkeit. */
:root{
  --z:1;
  --bg:#E7ECEE; --panel:#F8FAFB; --panel-2:#EEF2F4;
  --ink:#16283A; --ink-2:#44576A; --ink-3:#6E808E;
  --line:#C6D0D6; --line-2:#DAE2E6; --grid:rgba(22,40,58,.07);
  --rise:#1B7A57; --fall:#C33F2A;
  --left:#3F56C8; --right:#B46A08; --dx:#12829A; --dy:#AB2B69; --gold:#A87B06;
  --sN:#12829A; --sZ:#3F56C8; --sQ:#1B7A57; --sR:#16283A; --sI:#AB2B69;
  --lvL:#12829A; --lvM:#B46A08; --lvX:#3F56C8;
  --sky:#DCE6EA; --rock:#C9D3D9;
  --l1:#3F56C8; --l2:#12829A; --l3:#B46A08; --l4:#7A4FB8; --l5:#AB2B69; --l6:#5E7A12;
  --ff-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1720; --panel:#16222E; --panel-2:#1D2B39;
    --ink:#E7EFF3; --ink-2:#B3C4CF; --ink-3:#8499A7;
    --line:#2C3E4E; --line-2:#22323F; --grid:rgba(231,239,243,.08);
    --rise:#4FBF90; --fall:#F0846C;
    --left:#87A0FF; --right:#E9A44B; --dx:#3FC3DE; --dy:#E870A9; --gold:#E0B23F;
    --sN:#3FC3DE; --sZ:#87A0FF; --sQ:#4FBF90; --sR:#E7EFF3; --sI:#E870A9;
    --lvL:#3FC3DE; --lvM:#E9A44B; --lvX:#87A0FF;
    --sky:#122030; --rock:#243545;
    --l1:#87A0FF; --l2:#3FC3DE; --l3:#E9A44B; --l4:#B79BF0; --l5:#E870A9; --l6:#A8C64A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1720; --panel:#16222E; --panel-2:#1D2B39;
  --ink:#E7EFF3; --ink-2:#B3C4CF; --ink-3:#8499A7;
  --line:#2C3E4E; --line-2:#22323F; --grid:rgba(231,239,243,.08);
  --rise:#4FBF90; --fall:#F0846C;
  --left:#87A0FF; --right:#E9A44B; --dx:#3FC3DE; --dy:#E870A9; --gold:#E0B23F;
  --sN:#3FC3DE; --sZ:#87A0FF; --sQ:#4FBF90; --sR:#E7EFF3; --sI:#E870A9;
  --lvL:#3FC3DE; --lvM:#E9A44B; --lvX:#87A0FF;
  --sky:#122030; --rock:#243545;
  --l1:#87A0FF; --l2:#3FC3DE; --l3:#E9A44B; --l4:#B79BF0; --l5:#E870A9; --l6:#A8C64A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-ui);
  font-size:calc(17px*var(--z));line-height:1.6;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dx);outline-offset:2px}

/* ---------- Mathematik im Text ---------- */
.m{font-family:var(--ff-serif);font-size:1.06em;white-space:nowrap}
.m i{font-style:italic}
.m sup,.m sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  margin:0 .14em;line-height:1.12;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .22em .06em}
.fr>span:last-child{padding:.06em .22em 0}
.rt>span{border-top:1.5px solid currentColor;padding:0 .12em 0 .06em;margin-left:-.02em}
.set{font-family:var(--ff-serif);font-weight:600}
.nw{white-space:nowrap}

/* ---------- Schiene ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow:auto;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px 24px;display:flex;flex-direction:column;gap:6px}
.brand{display:block;text-decoration:none;color:inherit;padding:6px 8px 12px}
.brand svg{display:block}
.brand b{display:block;font-size:calc(19px*var(--z));font-weight:800;letter-spacing:-.025em;margin-top:8px}
.brand span{display:block;font-size:calc(13px*var(--z));color:var(--ink-3);font-weight:500}
.total{margin:0 8px 8px;padding:12px 12px 11px;border-radius:10px;background:var(--panel-2)}
.total .hm{font:800 calc(26px*var(--z))/1 var(--ff-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.total .hm small{font:600 calc(13px*var(--z)) var(--ff-ui);color:var(--ink-3);letter-spacing:0;margin-left:5px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .5s ease}
.total .of{font-size:calc(12.5px*var(--z));color:var(--ink-3);margin-top:6px}
.rnav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rnav .rt-h{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:baseline;
  padding:8px 8px 3px;color:var(--ink);font-weight:700;font-size:calc(15px*var(--z));text-decoration:none;border-radius:7px}
.rnav .rt-h .n{color:var(--ink-3);font-size:calc(13px*var(--z));font-variant-numeric:tabular-nums}
.rnav .rt-h .c{font:600 calc(12px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rnav .lv{display:flex;gap:4px;padding:0 4px 6px 34px;flex-wrap:wrap}
.rnav .lv a{font:600 calc(12.5px*var(--z))/1 var(--ff-ui);text-decoration:none;color:var(--ink-2);
  padding:6px 8px;border-radius:6px;border:1px solid transparent}
.rnav .lv a[aria-current="page"]{background:var(--ink);color:var(--panel)}
.rail .foot{margin-top:auto;padding:14px 8px 0;display:flex;gap:8px;flex-wrap:wrap}

main{min-width:0;padding:0 clamp(16px,3vw,40px) 96px}
.view{max-width:1060px;margin:0 auto;padding-top:34px}
.kicker{font:600 calc(14px*var(--z))/1.3 var(--ff-ui);color:var(--ink-3);margin:0 0 10px}
.view>h1{font-size:calc(clamp(30px,3.6vw,44px)*var(--z));font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.lead{font-size:calc(clamp(18px,1.45vw,21px)*var(--z));line-height:1.55;color:var(--ink-2);max-width:62ch}
.small{font-size:calc(15px*var(--z));color:var(--ink-2)}

.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:0 17px;min-height:44px;font:600 calc(15px*var(--z)) var(--ff-ui);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.prim{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:calc(13.5px*var(--z))}
.btn.tip{border-color:var(--gold);border-style:dashed}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}


/* ---------- Übersicht: Routenkarten mit Höhenprofil ---------- */
.routes{display:grid;gap:14px;margin-top:30px}
.route{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.rinfo{padding:16px 18px;display:grid;gap:8px;align-content:space-between}
.rprof{display:flex;align-items:flex-end;background:var(--sky);border-left:1px solid var(--line-2)}
.route header{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.route header .n{font:800 calc(15px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.route header h2{font-size:calc(23px*var(--z));font-weight:800}
.route header .hm{font:700 calc(14px*var(--z)) var(--ff-ui);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto}
.route .sub{font-size:calc(14.5px*var(--z));color:var(--ink-2)}
.prof{display:block;width:100%;height:auto}
.prof .sky{fill:var(--sky)}
.prof .leg{fill:var(--rock)}
.prof .done{opacity:.9}
.prof .path{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.prof .dot{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.8}
.prof .dot.on{stroke:var(--panel);stroke-width:1.6}
.prof .dot.cur{stroke:var(--ink);stroke-width:3}
.prof a{cursor:pointer}
.prof text{font:600 calc(11.5px*var(--z)) var(--ff-ui);fill:var(--ink-3)}
.legs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.2fr);gap:7px;margin-top:6px}
.legb{display:grid;gap:3px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);
  border-radius:10px;padding:8px 9px;background:var(--panel);min-width:0}
.legb b{font:700 calc(14px*var(--z))/1.2 var(--ff-ui);display:flex;align-items:center;gap:6px}
.legb span{font:600 calc(12.5px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.legb.tr{border-style:dashed}
.slope{width:18px;height:14px;flex:none}
.lvL,.lvM,.lvX{--lv:var(--lc,var(--ink-2))} .lvT{--lv:var(--ink-3)}
.slope rect,.slope path{fill:var(--lv)} .slope path[fill=none]{fill:none;stroke:var(--lv)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px 18px;margin-top:34px}
.how div{border-top:2px solid var(--ink);padding-top:10px;font-size:calc(15.5px*var(--z));color:var(--ink-2)}
.how b{display:block;color:var(--ink);font-size:calc(16px*var(--z));margin-bottom:3px}
.srcs{margin-top:34px;font-size:calc(14px*var(--z));color:var(--ink-3)}

/* ---------- Etappenkopf ---------- */
.stagehead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--panel)}
.seg a,.seg button{border:0;background:transparent;border-radius:999px;padding:0 13px;min-height:36px;
  font:600 calc(14px*var(--z)) var(--ff-ui);cursor:pointer;color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.seg a[aria-current="page"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg a[aria-current="page"] .slope rect,.seg a[aria-current="page"] .slope path{fill:var(--panel)} .seg a[aria-current="page"] .slope path[fill=none]{fill:none;stroke:var(--panel)}
.strip{background:var(--sky);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 20px}
.topbar{display:none}

/* ---------- Aufgabenkarte ---------- */
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.4vw,26px)}
.meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.badge{font:700 calc(12px*var(--z))/1 var(--ff-ui);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;
  background:var(--ink);color:var(--panel);white-space:nowrap}
.badge.src{background:transparent;color:var(--ink-3);border:1px solid var(--line);text-transform:none;letter-spacing:0;font-weight:600;font-size:calc(12.5px*var(--z))}
.badge.lv{background:transparent;color:var(--lv);border:1.5px solid var(--lv);display:inline-flex;gap:6px;align-items:center}
.meta .cnt{margin-left:auto;font:600 calc(13.5px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.task h2{font-size:calc(clamp(21px,2.1vw,26px)*var(--z));font-weight:800;margin-bottom:10px}
.stem{font-size:calc(17px*var(--z));line-height:1.65;max-width:70ch}
.stem p+p{margin-top:10px}
.rule{font-size:calc(14.5px*var(--z));color:var(--ink-3);margin-top:8px;max-width:70ch}
.fig{margin:16px 0 4px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel)}
.fig svg{display:block;width:100%;height:auto}
.fig.narrow{max-width:560px}
.fig.small{max-width:300px}
.zq svg{display:block;width:100%;max-width:220px;height:auto}
.qitem>svg{max-width:270px}
.ans{margin-top:18px;display:grid;gap:9px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.acts .sp{flex:1}

.qitem{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;
  padding:11px 14px 11px 46px;cursor:pointer;font:500 calc(16.5px*var(--z))/1.5 var(--ff-ui);width:100%;min-height:52px;position:relative}
.qitem::before{content:"";position:absolute;left:14px;top:14px;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:4px;background:var(--panel)}
.qitem.radio::before{border-radius:50%}
.qitem[aria-pressed="true"]{border-color:var(--ink);background:var(--panel-2)}
.qitem[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink);
  box-shadow:inset 0 0 0 3px var(--panel)}
.qitem.ok{border-color:var(--rise);background:color-mix(in srgb,var(--rise) 9%,var(--panel))}
.qitem.no{border-color:var(--fall);background:color-mix(in srgb,var(--fall) 9%,var(--panel))}
.qitem.miss{border-color:var(--rise);border-style:dashed}
.qitem:disabled{cursor:default;color:inherit}
.qitem .why{display:block;font-size:calc(14.5px*var(--z));color:var(--ink-2);margin-top:6px;line-height:1.5}
.qitem .mk{font:700 calc(12px*var(--z)) var(--ff-ui);letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.qitem.ok .mk,.qitem.miss .mk{color:var(--rise)} .qitem.no .mk{color:var(--fall)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:9px}
.qgrid.sm{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.qgrid .qitem{padding:44px 10px 10px}
.qgrid .qitem::before{top:12px;left:12px}
.qitem svg{display:block;width:100%;height:auto}
.qitem table{margin:0}
.calcl .qitem{font-family:var(--ff-serif);font-size:calc(19px*var(--z))}

.gapline{font:400 calc(19px*var(--z))/2 var(--ff-serif);max-width:66ch}
.gap{display:inline-block;min-width:5.5em;text-align:center;border-bottom:2px solid var(--ink-3);
  padding:0 8px;margin:0 3px;font:600 calc(16px*var(--z))/1.7 var(--ff-ui)}
.gap.set{border-color:var(--dx);color:var(--dx)} .gap.ok{border-color:var(--rise);color:var(--rise)}
.gap.no{border-color:var(--fall);color:var(--fall)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.col{border:1px solid var(--line-2);border-radius:10px;padding:10px;display:grid;gap:7px;align-content:start;background:var(--panel-2)}
.col>b{font:700 calc(13px*var(--z)) var(--ff-ui);color:var(--ink-3)}
.col .qitem{font-size:calc(15.5px*var(--z));min-height:46px;padding-left:42px}
.col .qitem::before{top:12px;left:12px}

.zrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.zrow.ok{border-color:var(--rise)} .zrow.no{border-color:var(--fall)}
.zq{font-size:calc(16.5px*var(--z));min-width:0}
.zq.s{font-family:var(--ff-serif);font-size:calc(19px*var(--z))}
.pick{display:flex;gap:4px;flex-wrap:wrap}
.pick button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);
  font:700 calc(15px*var(--z)) var(--ff-ui);cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pick button:disabled{cursor:default}
.pick.tf button{width:auto;padding:0 12px;font-size:calc(14px*var(--z))}
.zrow .why{grid-column:1/-1;font-size:calc(14.5px*var(--z));color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:6px 14px;margin-top:6px;
  border-top:1px solid var(--line-2);padding-top:12px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;font-size:calc(16.5px*var(--z))}
.opt b{font:700 calc(14px*var(--z)) var(--ff-ui);width:28px;height:28px;border-radius:7px;background:var(--panel-2);
  display:grid;place-items:center}
.opt .s{font-family:var(--ff-serif);font-size:calc(19px*var(--z))}

.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;
  border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel)}
.frow.ok{border-color:var(--rise)} .frow.no{border-color:var(--fall)}
.frow label{font-size:calc(17px*var(--z));min-width:0}
.frow .in{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.frow input{font:600 calc(17px*var(--z)) var(--ff-ui);padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--bg);width:8.5em;max-width:100%;min-height:42px}
.frow input.wide{width:13em}
.frow .u{font-size:calc(15.5px*var(--z));color:var(--ink-2)}
.frow .mark{font:800 calc(17px*var(--z)) var(--ff-ui);width:1.2em;text-align:center}
.frow.ok .mark{color:var(--rise)} .frow.no .mark{color:var(--fall)}
.frow .why{grid-column:1/-1;font-size:calc(14.5px*var(--z));color:var(--ink-2)}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.keys button{min-width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);
  font:600 calc(15px*var(--z)) var(--ff-serif);cursor:pointer;padding:0 8px}
textarea.open{width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);
  padding:10px 12px;font:400 calc(16.5px*var(--z))/1.5 var(--ff-ui);resize:vertical}
.model{border-left:4px solid var(--ink);background:var(--panel-2);border-radius:0 9px 9px 0;padding:12px 16px}
.model b.h{display:block;font:700 calc(12.5px*var(--z)) var(--ff-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.chk{display:grid;gap:7px;margin-top:4px}
.chk label{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:calc(16px*var(--z));cursor:pointer;
  border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--rise)}

.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.bin{min-height:104px;border:2px dashed var(--line);border-radius:10px;padding:9px 10px;background:var(--panel-2);cursor:pointer}
.bin.hot{border-color:var(--dx);background:color-mix(in srgb,var(--dx) 12%,var(--panel-2))}
.bin h5{font:700 calc(13.5px*var(--z))/1.3 var(--ff-ui);margin:0 0 8px;color:var(--ink-2)}
.bin .items,.tray{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;min-height:42px}
.tray{padding:10px;border:1px solid var(--line-2);border-radius:10px;min-height:62px}
.tcard{font:600 calc(18px*var(--z))/1 var(--ff-serif);background:var(--panel);border:1.5px solid var(--ink-3);
  border-radius:8px;padding:10px 13px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:42px;
  display:inline-flex;align-items:center}
.tcard.ghost{opacity:.22}
.tcard.fly{position:fixed;z-index:60;pointer-events:none;box-shadow:0 12px 28px rgba(0,0,0,.28);margin:0}
.tcard.sel{outline:3px solid var(--dx);outline-offset:2px}
.tcard.ok{border-color:var(--rise);background:color-mix(in srgb,var(--rise) 14%,var(--panel))}
.tcard.no{border-color:var(--fall);background:color-mix(in srgb,var(--fall) 14%,var(--panel))}
.tcard.lock{cursor:default}
.whys{display:grid;gap:5px;font-size:calc(14.5px*var(--z));color:var(--ink-2)}
.whys b{color:var(--ink)}

.tbl{border-collapse:collapse;font-size:calc(16px*var(--z));font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 12px;border:1px solid var(--line);text-align:center}
.tbl th{font:600 calc(14px*var(--z)) var(--ff-serif);font-style:italic;background:var(--panel-2)}
.tblw{overflow-x:auto;margin:12px 0 2px}

.fb{font-size:calc(16px*var(--z));margin-top:14px;max-width:70ch;padding:11px 14px;border-radius:10px;background:var(--panel-2)}
.fb.ok{background:color-mix(in srgb,var(--rise) 12%,var(--panel));color:var(--ink)}
.fb.no{background:color-mix(in srgb,var(--fall) 10%,var(--panel));color:var(--ink)}
.fb b.v{font-weight:800} .fb.ok b.v{color:var(--rise)} .fb.no b.v{color:var(--fall)}
.fb .gain{float:right;font:800 calc(15px*var(--z)) var(--ff-ui);color:var(--rise);margin-left:12px;font-variant-numeric:tabular-nums}
.hints{display:grid;gap:8px;margin-top:14px}
.hint{font-size:calc(15.5px*var(--z));line-height:1.55;border:1.5px dashed var(--gold);border-radius:10px;padding:10px 14px;max-width:70ch}
.hint b{color:var(--gold);font-weight:700}

/* ---------- Lösungsweg ---------- */
.sol{margin-top:20px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--panel)}
.sol>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:var(--panel)}
.sol>header b{font:700 calc(15px*var(--z)) var(--ff-ui)}
.sol>header span{font:600 calc(13px*var(--z)) var(--ff-ui);opacity:.75;font-variant-numeric:tabular-nums}
.sol>header .sp{flex:1}
.sol>header .btn{min-height:36px;font-size:calc(13.5px*var(--z));border-color:color-mix(in srgb,var(--panel) 45%,transparent);
  background:transparent;color:var(--panel)}
.sol>header .btn.go{background:var(--panel);color:var(--ink);border-color:var(--panel)}
.sol .viz{border-bottom:1px solid var(--line-2);background:var(--panel)}
.sol .viz svg{display:block;width:100%;height:auto;max-height:420px}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.ctl label{font:600 calc(14.5px*var(--z)) var(--ff-ui);color:var(--ink-2)}
.ctl output{font:700 calc(15px*var(--z)) var(--ff-ui);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.ctl input[type=range]{flex:1 1 160px;min-width:120px;height:40px;accent-color:var(--ink)}
.steps{list-style:none;margin:0;padding:6px 16px 14px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;
  border-top:1px solid var(--line-2);animation:rise .35s ease both}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);font:700 calc(13px*var(--z)) var(--ff-ui);color:var(--panel);background:var(--ink);
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
.steps .tx{font-size:calc(16.5px*var(--z));line-height:1.6;max-width:66ch}
.steps .ma{font-family:var(--ff-serif);font-size:calc(20px*var(--z));line-height:1.7;margin-top:6px;overflow-x:auto;padding-bottom:2px}
.steps .ma .m{font-size:1em}
.merk{margin:0 16px 16px;border-left:4px solid var(--rise);background:var(--panel-2);border-radius:0 9px 9px 0;padding:11px 15px;font-size:calc(16px*var(--z))}
.merk b.h{display:block;font:700 calc(12.5px*var(--z)) var(--ff-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--rise);margin-bottom:3px}
.hl{background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:4px;padding:0 3px}
.cR{color:var(--right);font-weight:600} .cD{color:var(--dx);font-weight:600} .cY{color:var(--dy);font-weight:600}
.cL{color:var(--left);font-weight:600} .cG{color:var(--rise);font-weight:600} .cF{color:var(--fall);font-weight:600}

/* SVG-Auftritte */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes sweep{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
.an-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .75s ease forwards}
.an-pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.an-fade{animation:fade .5s ease both}
.an-grow{animation:grow .7s ease both;transform-box:fill-box;transform-origin:left center}
.an-sweep{animation:sweep 2.6s ease-in-out both}
.noanim .an-draw{animation:none;stroke-dashoffset:0}
.noanim .an-pop,.noanim .an-fade,.noanim .an-grow{animation:none}
.noanim .an-sweep{animation:none;transform:translateX(var(--x1))}
svg text{font-family:var(--ff-ui)}
.halo{paint-order:stroke;stroke:var(--panel);stroke-width:4.5px;stroke-linejoin:round}

/* ---------- Training ---------- */
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.kind{font:600 calc(14.5px*var(--z))/1.2 var(--ff-ui);padding:9px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);
  cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.kind[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.kind[aria-pressed="true"] .slope rect,.kind[aria-pressed="true"] .slope path{fill:var(--panel)}
.kind .c{font:600 calc(12px*var(--z)) var(--ff-ui);opacity:.7;font-variant-numeric:tabular-nums}
.streak{font:700 calc(14px*var(--z)) var(--ff-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:calc(15px*var(--z));color:var(--ink-2)}
.confirm{border:1.5px solid var(--fall);border-radius:12px;padding:12px 14px;margin:0 8px;font-size:calc(14px*var(--z));display:grid;gap:8px}

/* ---------- Schmale Fenster, Tablet und Vollbild: Schiene wird zur Schublade, oben eine Kopfleiste ---------- */
body{--stick:14px}
body.nar{grid-template-columns:minmax(0,1fr);--stick:66px}
body.nar .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:50;transform:translateX(-105%);
  transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25);height:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.nar.menu .rail{transform:none}
body.nar .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:8px;
  padding:calc(7px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.topbar>a{font:800 calc(17px*var(--z)) var(--ff-ui);letter-spacing:-.02em;color:inherit;text-decoration:none}
.topbar .thm{font:600 calc(13.5px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap}
body.nar .view{padding-top:20px}
.zoom{display:inline-flex;gap:4px}
.btn.zb{min-width:42px;padding:0 9px;justify-content:center;font-weight:700;gap:1px}
.btn.zb small{font-size:.82em;font-weight:700}
.btn.zb.big{font-size:calc(17px*var(--z))}
.btn.fsb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
body.fs .kicker,body.fs .sh1{display:none}
body.fs .view{padding-top:12px;max-width:1240px}
body.fs .strip{margin:8px 0 12px}
body.fs .stagehead{margin-bottom:0}
body.fs main{padding-bottom:40px}
.sh1{font-size:calc(clamp(24px,2.6vw,32px)*var(--z));margin:0}
.lead.tlead{font-size:calc(17px*var(--z));margin-top:10px}

/* ---------- Formate der Matura-Etappe ---------- */
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-8px 0 16px}
body.fs .fchips{margin-top:0}
.fchips .fl{font:600 calc(13px*var(--z)) var(--ff-ui);color:var(--ink-3);margin-right:4px}
.fchip{display:inline-flex;gap:7px;align-items:center;font:600 calc(13.5px*var(--z))/1 var(--ff-ui);padding:0 11px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink-2);text-decoration:none;min-height:36px;white-space:nowrap}
.fchip .c{font:600 calc(12px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.fchip.on{border-color:var(--lvX);color:var(--ink);box-shadow:inset 0 0 0 1px var(--lvX)}
.fchip.all .c{color:var(--rise)}

/* ---------- Aufgabe in zwei Spalten, sobald Platz ist ---------- */
.view{container-type:inline-size;container-name:view}
.tbody{display:grid;grid-template-columns:minmax(0,1fr)}
.tleft,.tright{min-width:0}
@container view (min-width:880px){
  .tbody.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 30px;align-items:start}
  .tbody.two .tright>:first-child{margin-top:0}
  .tbody.two:not(.hopen) .tleft{position:sticky;top:var(--stick)}
  .tbody.two .fig.narrow{max-width:none}
  .solbody.hasviz{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,10fr);align-items:start}
  .solbody.hasviz .solL{position:sticky;top:var(--stick);border-right:1px solid var(--line-2)}
  .solbody.hasviz .viz{border-bottom:0}
  .solbody.hasviz .ctl{border-top:1px solid var(--line-2);border-bottom:0}
}
@container view (max-width:820px){
  .legs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container view (max-width:600px){
  .route{grid-template-columns:minmax(0,1fr)}
  .rprof{border-left:0;border-top:1px solid var(--line-2)}
}

/* ---------- Werkzeuge zum Ausprobieren ---------- */
.helprow{margin-top:14px}
.btn.help{border-color:var(--dx);color:var(--dx);background:color-mix(in srgb,var(--dx) 7%,var(--panel));white-space:normal;text-align:left;padding-top:6px;padding-bottom:6px}
.btn.help[aria-expanded="true"]{background:var(--dx);color:var(--panel)}
.helpbox{margin-top:12px;border:1.5px solid var(--dx);border-radius:12px;overflow:hidden;background:var(--panel)}
.helpbox>header{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 14px;background:color-mix(in srgb,var(--dx) 12%,var(--panel))}
.helpbox>header b{display:inline-flex;gap:8px;align-items:center;font:700 calc(15px*var(--z)) var(--ff-ui);color:var(--dx)}
.helpbox>header svg{width:18px;height:18px;flex:none}
.helpbox>header .sp{flex:1}
.hx{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center}
.hx svg{width:20px;height:20px}
.hhint{padding:10px 14px 0;font-size:calc(15px*var(--z));line-height:1.5;color:var(--ink-2)}
.hbody{padding:12px 14px 14px;display:grid;gap:12px}
.hbody>*{min-width:0}
.hviz{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel)}
.hviz svg{display:block;width:100%;height:auto;max-height:420px}
.hrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.hsay{font-size:calc(15.5px*var(--z));line-height:1.55;background:var(--panel-2);border-radius:10px;padding:10px 13px}
.hsay:empty{display:none}
.hlines{display:grid;gap:7px;font-size:calc(16px*var(--z));line-height:1.55}
.hlines .small{font-size:calc(14.5px*var(--z))}
.hbig{font:600 calc(23px*var(--z))/1.6 var(--ff-serif);padding:2px 2px 4px;overflow-x:auto}
.hbig .m{font-size:1em;white-space:normal}
.hbig .small{font:500 calc(14.5px*var(--z)) var(--ff-ui);white-space:nowrap}
.hstep{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:4px 5px 4px 12px;background:var(--panel)}
.hstep .lab{font:600 calc(14px*var(--z)) var(--ff-ui);color:var(--ink-2);margin-right:4px}
.hstep output{font:700 calc(17px*var(--z)) var(--ff-ui);min-width:2.3em;text-align:center;font-variant-numeric:tabular-nums}
.stp{width:42px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel-2);font:700 calc(21px*var(--z))/1 var(--ff-ui);cursor:pointer;padding:0}
.stp:disabled{opacity:.38;cursor:default}
.ctl.hctl{border:1px solid var(--line-2);border-radius:10px;padding:6px 12px}
.ctl.hctl output:empty{display:none}
.hpath{display:grid;gap:6px;align-content:start}
.hq{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;font-size:calc(15px*var(--z))}
.hsplit{display:grid;gap:12px}
.hchain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hrest{font:600 calc(13.5px*var(--z)) var(--ff-ui);padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel-2);white-space:nowrap}
.hrest.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 24%,var(--panel))}
.hrest.zero,.hrest.ok{border-color:var(--rise)}
.hrest.bad{border-color:var(--fall)}
.harrow{font:500 calc(14px*var(--z)) var(--ff-serif);color:var(--ink-2);white-space:nowrap}
.harrow::before{content:"→ "} .harrow::after{content:" →"}
.hstrip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.hcell{display:grid;gap:1px;text-align:center;border:1px solid var(--line-2);border-radius:7px;padding:5px 0;font-size:calc(12px*var(--z));font-variant-numeric:tabular-nums}
.hcell b{font-size:calc(13px*var(--z))}
.hcell.cur{border-color:var(--ink);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--ink)}
.hcell.bad{border-color:var(--fall);border-style:dashed}
.hchip{display:inline-block;min-width:6em;font:700 calc(11.5px*var(--z)) var(--ff-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.helpbox .kinds{margin:0}
.helpbox .seg{border-radius:14px}

/* ---------- Teil 2: Gipfeltouren ---------- */
.t2h{font-size:calc(clamp(22px,2.2vw,27px)*var(--z));font-weight:800;margin-top:40px}
.t2l{font-size:calc(16.5px*var(--z));color:var(--ink-2);max-width:66ch;margin-top:6px}
.tours{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:16px}
.tour{display:grid;gap:5px;align-content:start;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;border-top:4px solid var(--lvX)}
.tour .n{font:800 calc(13px*var(--z)) var(--ff-ui);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.tour b{font:800 calc(20px*var(--z))/1.25 var(--ff-ui);letter-spacing:-.015em}
.tour .sub{font-size:calc(14.5px*var(--z));color:var(--ink-2)}
.tour .c{font:600 calc(12.5px*var(--z)) var(--ff-ui);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tdots{display:flex;gap:4px;margin-top:8px}
.tdots i{font:700 calc(11.5px*var(--z))/1 var(--ff-ui);font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--ink-3)}
.tdots i.on{background:var(--lvX);border-color:var(--lvX);color:var(--panel)}
.tsteps{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.tstep{font:700 calc(14px*var(--z))/1 var(--ff-ui);min-width:42px;height:38px;padding:0 10px;border-radius:999px;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:var(--panel);color:var(--ink-2);text-decoration:none}
.tstep.open{border-color:var(--lvX);color:var(--ink)}
.tstep.done{background:var(--lvX);border-color:var(--lvX);color:var(--panel)}
.tstep.lock{border-style:dashed;color:var(--ink-3);background:transparent}
.angabe{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:12px;padding:16px 20px 16px}
.angabe h3{font:700 calc(12.5px*var(--z)) var(--ff-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.atext{font-size:calc(17px*var(--z));line-height:1.7;max-width:74ch}
.atext p+p{margin-top:9px}
.mk{background:transparent;color:inherit;border-bottom:2px dotted var(--ink-3);padding:0 1px;border-radius:3px;transition:background .25s ease}
.mk.on{background:color-mix(in srgb,var(--gold) 30%,transparent);border-bottom:2px solid var(--gold)}
.notesbox{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
.notesbox>b{font:700 calc(12.5px*var(--z)) var(--ff-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--rise)}
.notes{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:calc(15.5px*var(--z));color:var(--ink-2)}
.notes b{color:var(--ink);margin-right:4px}
.tparts{display:grid;gap:16px;margin-top:18px}
.locked{display:grid;gap:3px;border:1.5px dashed var(--line);border-radius:12px;padding:13px 18px;color:var(--ink-3)}
.locked b{font:700 calc(16px*var(--z)) var(--ff-ui);color:var(--ink-2)}
.locked span{font-size:calc(14.5px*var(--z))}
.task.fresh{animation:rise .5s ease both}
.summit{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:18px;border:1.5px solid var(--gold);border-radius:12px;padding:13px 18px;background:color-mix(in srgb,var(--gold) 10%,var(--panel));font-size:calc(16px*var(--z))}
.summit .sp{flex:1}
.tbar{position:sticky;top:calc(var(--stick) - 14px);z-index:20;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--bg);padding:8px 0;margin:10px 0 8px;border-bottom:1px solid var(--line)}
.tbar .tsteps{margin:0}
.tourv .tbody.two:not(.hopen) .tleft,.tourv .solbody.hasviz .solL{top:calc(var(--stick) + 58px)}
.asheet{position:fixed;left:0;right:0;bottom:0;z-index:39;max-height:62vh;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--ink);box-shadow:0 -10px 36px rgba(0,0,0,.25);
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.asheet[hidden]{display:none}
.asheet>header{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px;border-bottom:1px solid var(--line-2)}
.asheet>header b{font:700 calc(15px*var(--z)) var(--ff-ui)}
.asheet>header .sp{flex:1}
.asheet .abody{overflow:auto;padding:12px 18px 6px;-webkit-overflow-scrolling:touch}
.asheet .atext{margin:0 auto}
.asheet .notesbox{max-width:74ch;margin-left:auto;margin-right:auto}

/* ---------- Eigene Tastatur für Finger ---------- */
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:330px;margin-top:4px}

/* ============ Kurven für Graphenaufgaben ============
   knotCurve: glatte Kurve mit Extremstellen genau an ganzzahligen Knoten. Zwischen zwei Knoten verläuft sie wie
   y = y1 + (y2 - y1)(3t² - 2t³); die Wendestelle liegt genau in der Mitte. Vor dem ersten und nach dem letzten Knoten

    if(x>=K[n-1][0]){ var t2=(x-K[n-1][0])/(b-K[n-1][0]); return K[n-1][1]+(yb-K[n-1][1])*t2*t2; }

    return NaN;
  };

  var cut=[a].concat(K.map(function(k){ return k[0]; }),[b]), cv=[ya].concat(K.map(function(k){ return k[1]; }),[yb]);
  C.pieces=[]; for(var i=0;i<cut.length-1;i++) C.pieces.push({x1:cut[i],x2:cut[i+1],up:cv[i+1]>cv[i]});
  C.ext=K.map(function(k,i){ var l=i===0?ya:K[i-1][1], r=i===K.length-1?yb:K[i+1][1]; return {x:k[0],y:k[1],max:k[1]>l&&k[1]>r,min:k[1]<l&&k[1]<r}; });

  C.kr=[]; 
  C.kr.push({x1:a,x2:K[0][0],links:ya>K[0][1]});

    C.kr.push({x1:K[q][0],x2:m,links:up}); C.kr.push({x1:m,x2:K[q+1][0],links:!up}); }
